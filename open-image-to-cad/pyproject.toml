[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-image-to-cad"
version = "0.1.0"
description = "Local-first, adapter-based image/text-to-CAD system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cadquery>=2.4.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "build123d>=0.5.0",
    "opencv-python-headless>=4.9.0",
]

[project.scripts]
open-image-to-cad = "open_image_to_cad.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
